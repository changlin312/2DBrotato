<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>2DBrotato - 幸存者射击</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14141e;
    color: #eee;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #wrap { position: relative; width: 960px; height: 640px; }
  canvas { display: block; background: #1b1b28; border: 2px solid #3a3a55; border-radius: 6px; }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(12, 12, 20, 0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 6px; text-align: center;
    overflow-y: auto;
  }
  .hidden { display: none; }
  h1 { font-size: 42px; color: #ffd166; margin-bottom: 12px; }
  h2 { font-size: 28px; color: #ffd166; margin: 14px 0 6px; }
  .sub { color: #aaa; margin-bottom: 20px; line-height: 1.8; }
  button {
    background: #ffd166; color: #222; border: none;
    padding: 10px 26px; font-size: 17px; font-weight: bold;
    border-radius: 6px; cursor: pointer; margin: 6px;
  }
  button:hover { background: #ffe29a; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #shop-cards { display: flex; gap: 12px; margin: 12px 0; }
  .card {
    width: 170px; background: #23233a; border: 1px solid #44446a;
    border-radius: 8px; padding: 12px; display: flex;
    flex-direction: column; gap: 6px; min-height: 170px;
    position: relative;
  }
  .card.sold { opacity: 0.35; }
  .card.lockedcard { border-color: #ffd166; box-shadow: 0 0 6px rgba(255, 209, 102, 0.4); }
  .card .lockbtn {
    position: absolute; top: 6px; right: 6px;
    background: #33334f; color: #aaa;
    font-size: 11px; padding: 3px 8px; margin: 0;
    border-radius: 4px;
  }
  .card .lockbtn:hover { background: #44446a; color: #fff; }
  .card .lockbtn.locked { background: #ffd166; color: #222; }
  .card .cname { font-size: 17px; font-weight: bold; margin-top: 14px; }
  .card .ctype { font-size: 12px; color: #8ecae6; }
  .card .cdesc { font-size: 13px; color: #bbb; flex: 1; }
  .card button { font-size: 14px; padding: 6px 10px; margin: 0; }
  #shop-info { font-size: 15px; color: #ffd166; margin-top: 4px; }
  #shop-stats { font-size: 13px; color: #9ad; margin: 8px 0; line-height: 1.7; max-width: 760px; }
  .weapon-tag { display: inline-block; background: #33334f; border-radius: 4px; padding: 2px 8px; margin: 2px; font-size: 13px; }
  .card .dupbtn { font-size: 11px; background: #4361ee; color: #fff; padding: 4px 8px; margin-top: 2px; }
  .card .dupbtn:disabled { background: #555; color: #999; }
  #weapon-manage {
    display: flex; flex-direction: column; gap: 4px;
    margin: 6px 0; max-width: 580px;
  }
  .wm-row {
    display: flex; gap: 8px; align-items: center;
    background: #23233a; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #33334f;
  }
  .wm-row .wm-name {
    font-size: 14px; padding: 2px 10px;
    background: #1d1d2e; border-radius: 4px; flex: 1;
  }
  .wm-row button {
    font-size: 13px; padding: 4px 10px; margin: 0;
  }
  .wm-fuse { background: #56cfe1 !important; color: #14141e !important; }
  .wm-fuse:hover { background: #80e7f5 !important; }
  .wm-fuse:disabled { background: #4a4a55 !important; color: #777 !important; }
  .wm-sell { background: #ffb703 !important; color: #14141e !important; }
  .wm-sell:hover { background: #ffce4d !important; }
  .inlinebtn { font-size: 12px; padding: 2px 10px; margin: 0 0 0 8px; background: #8df; color: #222; }
  #btn-speed {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    background: #3a3a55; color: #ffd166;
    padding: 6px 14px; font-size: 16px; border-radius: 5px;
    margin: 0;
  }
  #btn-speed:hover { background: #555577; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>
  <button id="btn-speed">1x</button>

  <div id="menu" class="overlay">
    <h1>2DBrotato</h1>
    <div class="sub">
      WASD / 方向键 移动，武器自动瞄准射击<br>
      在每波 30 秒的敌潮中幸存，捡取金币，商店中购买枪械与道具<br>
      每 10 波将遭遇随机 BOSS，坚持到第 30 波即可通关！
    </div>
    <button id="btn-start">开始游戏</button>
    <button id="btn-dash" onclick="window.open('dashboard.html','_blank')">数据看板</button>
  </div>

  <div id="shop" class="overlay hidden">
    <h2 id="shop-title">商店</h2>
    <div id="shop-info"></div>
    <div id="shop-cards"></div>
    <div>
      <button id="btn-reroll">刷新</button>
      <button id="btn-buyall">一键购买</button>
      <button id="btn-next">开始下一波</button>
    </div>
    <div id="shop-stats"></div>
    <div id="weapon-manage"></div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h1>你死了</h1>
    <div class="sub" id="go-info"></div>
    <button id="btn-restart">再来一局</button>
  </div>

  <div id="victory" class="overlay hidden">
    <h1 style="color:#8dff8d">通关胜利!</h1>
    <div class="sub" id="v-info"></div>
    <button id="btn-menu">回到主界面</button>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/shop.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
